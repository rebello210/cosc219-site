<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Felipe Chedid Rebello</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h1>contact me</h1>
        <form action="#" method="post">
            <fieldset>
                <legend>Preferred contact form</legend>
                <input type="radio" id="c-email" name="contact-method" value="email">
                <label for="c-email">Email</label>
                <input type="radio" id="c-phone" name="contact-method" value="phone">
                <label for="c-phone">Phone</label>
            </fieldset>
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="city">City:</label>
                <input list="cities" id="city" name="city">
                <datalist id="cities">
                    <option value="kelowna">
                    <option value="vernon">
                    <option value="west kelowna">
                </datalist>
            </p>
            <p>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </p>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>Felipe Chedid Rebello</p>
    </footer>
</body>
</html>
