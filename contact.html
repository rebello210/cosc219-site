<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Felipe Chedid Rebello</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h1>contact me</h1>
        <form action="#" method="post">
            <fieldset>
                <legend>Preferred contact method</legend>
                <label for="c-email">Email</label>
                <input type="radio" id="c-email" name="contact-method" value="email">
                <label for="c-phone">Phone</label>
                <input type="radio" id="c-phone" name="contact-method" value="phone">
                
            </fieldset>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </p>
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="city">City:</label>
                <select id="city" name="city">
                    <option value="vernon">Vernon</option>
                    <option value="west-kelowna">West Kelowna</option>
                    <option value="kelowna">Kelowna</option>
                </select>
            </p>
            <p>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </p>
            
            <p>
                <input type="checkbox" id="copy" name="copy" value="yes">
                <label for="copy">Send me a copy of this message</label>
            </p>
            
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>Felipe Chedid Rebello</p>
    </footer>
</body>
</html>
